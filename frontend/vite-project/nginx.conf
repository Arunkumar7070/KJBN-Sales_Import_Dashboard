server {
    listen 5173;
    root /usr/share/nginx/html;
    index index.html;

    # React Router handles pages like /transactions in the browser, so any
    # path that isn't a real file gets index.html instead of a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Built JS/CSS files: a missing one is a real 404, not the HTML page.
    location /assets/ {
        try_files $uri =404;
    }
}
