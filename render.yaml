services:
  - type: web
    name: kjbn-sales-backend
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt && alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: APP_ENV
        value: production
      - key: CORS_ALLOWED_ORIGINS
        value: http://localhost:5173,http://127.0.0.1:5173
      - key: MAX_UPLOAD_SIZE_BYTES
        value: "10485760"
      - key: ALLOW_TEST_CLOCK
        value: "false"
      - key: UPLOAD_RATE_LIMIT_PER_MINUTE
        value: "60"
      - key: MAX_FILES_PER_UPLOAD
        value: "10"
      - key: PYTHON_VERSION
        value: "3.12.8"
