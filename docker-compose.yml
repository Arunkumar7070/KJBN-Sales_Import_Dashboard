services:
  db:
    image: postgres:16
    environment:
      # Throwaway credentials for local use only, not real secrets.
      POSTGRES_USER: kjbn
      POSTGRES_PASSWORD: kjbn
      POSTGRES_DB: kjbn
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kjbn -d kjbn"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      # Local-only values, so no .env file is needed.
      DATABASE_URL: postgresql://kjbn:kjbn@db:5432/kjbn
      CORS_ALLOWED_ORIGINS: http://localhost:5173
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # The slim image has no curl; urlopen fails on any non-2xx response.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s  # Migrations and the seed run before the server starts.

  frontend:
    build:
      context: ./frontend/vite-project
      args:
        # Baked into the bundle; the reviewer's browser calls the API here.
        VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  db-data:
